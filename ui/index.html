<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RelayPing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161a21'/%3E%3Cpath d='M5 21h5l3-9 4 13 3-8h7' fill='none' stroke='%233ee6c4' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f4f5f7; --surface: #fcfcfb; --surface-2: #f0f1f3;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #7d7b75;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #0f8f78; --accent-ink: #ffffff; --accent-soft: rgba(15,143,120,0.10);
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0e1116; --surface: #161a21; --surface-2: #1d222b;
    --ink: #ffffff; --ink-2: #c3c6cf; --muted: #8a8f9a;
    --grid: #252a33; --axis: #353b46; --border: rgba(255,255,255,0.09);
    --accent: #3ee6c4; --accent-ink: #06231d; --accent-soft: rgba(62,230,196,0.10);
    --good-ink: #2fc42f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; }
[hidden] { display: none !important; }

header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
header .wrap { display: flex; align-items: center; gap: 14px; padding-top: 12px; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; }
.status { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.dot.bad { background: var(--critical); } .dot.wait { background: var(--warning); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; transition: background .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 12.5px; border-radius: 7px; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; }
.soon { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }

/* Hinweise */
.banners { display: grid; gap: 10px; margin-top: 18px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
.banner.warn { border-color: color-mix(in srgb, var(--critical) 45%, var(--border)); background: color-mix(in srgb, var(--critical) 7%, var(--surface)); }
.banner.info { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.banner .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 13px; }
.banner.warn .ic { background: var(--critical); color: #fff; }
.banner.info .ic { background: var(--accent); color: var(--accent-ink); }
.banner .txt { flex: 1; min-width: 0; }
.banner .meta { color: var(--muted); font-size: 12px; }

/* Tunnel */
.tunnels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin: 18px 0 0; }
.tunnel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 3px 16px; align-items: center; }
.tunnel .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tunnel .server { font-size: 17px; font-weight: 650; }
.tunnel .meta { color: var(--ink-2); font-size: 13px; }
.tunnel .big { grid-row: 1 / span 3; grid-column: 2; text-align: right; }
.tunnel .big .v { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.tunnel .big .u { color: var(--muted); font-size: 13px; margin-left: 2px; }
.tunnel .health { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.tunnel .health .bad { color: var(--critical); font-weight: 600; }
.tunnel .speedline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.tunnel .speedline b { color: var(--ink); }
.speedbar { width: 90px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.speedbar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
.tunnel .hint { grid-column: 1 / -1; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.tunnel .hint b { color: var(--ink); font-weight: 600; }
.routerbar { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; margin-top: 12px; padding: 9px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--ink-2); }
.routerbar b { color: var(--ink); font-weight: 600; }
.meter { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; margin-left: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); }

.tabs { display: flex; gap: 4px; margin: 22px 0 14px; border-bottom: 1px solid var(--border); }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--ink-2); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border); }
.field { display: flex; align-items: center; gap: 8px; }
input[type=text], input[type=password], input[type=number], select { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 11px; outline: none; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search { min-width: 240px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.chart-card { padding: 16px 16px 10px; }
.chart-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 4px 8px; }
.chart-head h3 { margin: 0; font-size: 14px; font-weight: 650; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.key.loss { width: 3px; height: 10px; background: var(--critical); }
.chart-box { position: relative; height: 300px; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 5; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
.tip .row b { min-width: 58px; text-align: right; font-weight: 650; }
.tip .row .n { color: var(--ink-2); }
.empty { padding: 44px 20px; text-align: center; color: var(--muted); }

.mons { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 14px; }
.mon { padding: 14px 16px; }
.mon .top { display: flex; align-items: center; gap: 8px; }
.mon .host { font-weight: 650; }
.mon .city { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.x { margin-left: auto; width: 26px; height: 26px; border-radius: 7px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
.x:hover { background: var(--surface-2); color: var(--ink); }
.mon .now { display: flex; align-items: baseline; gap: 4px; margin: 10px 0 8px; }
.mon .now .v { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
.mon .now .u { color: var(--muted); font-size: 13px; }
.mon .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 12px; }
.mon .stats div { display: flex; flex-direction: column; }
.mon .stats .k { color: var(--muted); }
.mon .stats .val { font-weight: 600; }
.mon .state { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.best { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.warn-loss { color: var(--critical); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }

/* Bestenliste */
.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 14px; }
.hero { padding: 16px 18px; }
.hero .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.hero .h { font-size: 20px; font-weight: 700; margin-top: 4px; }
.hero .m { color: var(--ink-2); font-size: 13px; }
.hero .v { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.boardinfo { color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 20px; height: 20px; border-radius: 50%; }
.chip button:hover { background: var(--surface-2); color: var(--ink); }
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 0 0 14px; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.ctabs { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; padding: 8px 8px 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
th.r, td.r { text-align: right; }
th[aria-sort]::after { content: " ↓"; color: var(--accent); }
th[aria-sort="descending"]::after { content: " ↑"; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
tr.active td { background: var(--accent-soft); }
.barcell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--s1); opacity: .85; }
.muted { color: var(--muted); }
.spark { display: block; }
.actions { display: inline-flex; gap: 6px; align-items: center; }
.handshake-idle { color: var(--muted); }

footer { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--muted); font-size: 12.5px; }
.link { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.disclaimer { flex-basis: 100%; font-size: 11.5px; }

.overlay { position: fixed; inset: 0; background: rgba(5,8,12,.55); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 20px; }
.dialog { width: min(480px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 24px; }
.dialog.wide { width: min(620px, 100%); }
.dialog h2 { margin: 0 0 6px; font-size: 18px; }
.dialog h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dialog p { margin: 0 0 14px; color: var(--ink-2); }
.dialog label.l { display: block; font-size: 12.5px; color: var(--ink-2); margin: 12px 0 5px; font-weight: 550; }
.dialog .full { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 90px 110px; gap: 10px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.setrow:last-child { border-bottom: 0; }
.setrow .d { color: var(--muted); font-size: 12px; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.err { color: var(--critical); background: color-mix(in srgb, var(--critical) 10%, transparent); border-radius: 9px; padding: 9px 12px; margin-top: 14px; font-size: 13px; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 8px 0 4px; }
.kv .k { color: var(--muted); }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: 90vw; }
.swto { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; font-size: 15px; }
.swto b { font-weight: 650; }
@media (max-width: 640px) {
  .wrap { padding: 0 14px 30px; } .search { min-width: 0; flex: 1; }
  header .wrap { gap: 8px; } .brand .soon { display: none; }
  .status #statusText { display: none; } .status { padding: 7px; }
  .banner { flex-wrap: wrap; } .banner .txt { flex: 1 1 calc(100% - 70px); }
  .banner .btn { order: 3; margin-left: 34px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--surface-2)"/><path d="M5 21h5l3-9 4 13 3-8h7" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      RelayPing <span class="soon">Beta</span>
    </div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">…</span></div>
    <div class="spacer"></div>
    <button class="btn ghost icon-btn" id="btnSettings" data-i18n-title="settings" data-i18n-aria="settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="btn small" id="btnQuit" data-i18n="quit">Beenden</button>
  </div>
</header>

<main class="wrap">
  <section class="banners" id="banners"></section>
  <section class="tunnels" id="tunnels"></section>
  <div class="routerbar" id="routerbar" hidden></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="live" aria-selected="true" data-i18n="tabLive">Live</button>
    <button class="tab" role="tab" data-tab="board" aria-selected="false" data-i18n="tabBoard">Bestenliste</button>
    <button class="tab" role="tab" data-tab="scan" aria-selected="false" data-i18n="tabScan">Rangliste</button>
  </nav>

  <!-- LIVE -->
  <section class="panel" id="panel-live">
    <div class="controls">
      <div class="seg" id="rangeSeg">
        <button data-s="60" aria-pressed="false" data-i18n="min1">1 Min</button>
        <button data-s="300" aria-pressed="true" data-i18n="min5">5 Min</button>
        <button data-s="900" aria-pressed="false" data-i18n="min15">15 Min</button>
      </div>
      <div class="seg" id="scaleSeg" data-i18n-title="scaleHelp">
        <button data-v="auto" data-i18n="scaleAuto">Auto</button>
        <button data-v="lin" data-i18n="scaleLin">Linear</button>
        <button data-v="log" data-i18n="scaleLog">Log</button>
      </div>
      <select id="favSel" aria-label="Favoriten"></select>
      <div class="spacer"></div>
      <div class="field">
        <input type="text" class="search" id="addInput" list="relayList" data-i18n-ph="addPh" autocomplete="off">
        <datalist id="relayList"></datalist>
        <button class="btn" id="btnAdd" data-i18n="watchLive">Live beobachten</button>
      </div>
    </div>
    <div class="card chart-card">
      <div class="chart-head"><h3 data-i18n="latencyMs">Latenz in ms</h3><div class="legend" id="legend"></div></div>
      <div class="chart-box" id="chartBox">
        <canvas id="chart" role="img"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="empty" id="chartEmpty" hidden data-i18n="chartEmpty"></div>
      </div>
    </div>
    <div class="mons" id="mons"></div>
  </section>

  <!-- BESTENLISTE -->
  <section class="panel" id="panel-board" hidden>
    <div class="controls">
      <div class="chips" id="bChips"></div>
      <select id="bAdd" aria-label="Land"></select>
      <div class="spacer"></div>
      <label class="field muted"><span data-i18n="every">alle</span>
        <select id="bInterval"><option value="5">5 s</option><option value="10">10 s</option><option value="30">30 s</option><option value="60">60 s</option></select>
      </label>
      <label class="toggle"><input type="checkbox" id="bOn"> <span data-i18n="boardOn">läuft</span></label>
    </div>
    <div class="heroes" id="heroes"></div>
    <div class="card" style="padding: 6px 6px 4px;">
      <div class="boardinfo" id="bInfo" style="padding: 8px 12px 2px;"></div>
      <div class="table-wrap">
        <table id="boardTable">
          <thead><tr>
            <th data-k="rank" class="r">#</th>

function colorFor(host) {

// ---------- Ereignisse ----------
function connectEvents() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => {
    const prevLang = LANG; S = JSON.parse(e.data); LANG = S.lang || "de";
    if (LANG !== prevLang) applyI18n();
    renderAll();
  });
  es.addEventListener("backfill", (e) => {
    const bf = JSON.parse(e.data);
    for (const [host, arr] of Object.entries(bf)) series.set(host, { samples: arr.map(([t, ms]) => ({ t, ms: ms < 0 ? null : ms })) });
    draw(); renderMons(); renderTunnels();
  });
  es.addEventListener("sample", (e) => {
    const s = JSON.parse(e.data);
    let x = series.get(s.host); if (!x) { x = { samples: [] }; series.set(s.host, x); }
    x.samples.push({ t: s.t, ms: s.ms < 0 ? null : s.ms });
    const cut = Date.now() - MAX_KEEP; while (x.samples.length && x.samples[0].t < cut) x.samples.shift();
  });
  es.addEventListener("scan", (e) => { scan = JSON.parse(e.data); renderScan(); renderTunnels(); });
  es.addEventListener("board", (e) => { board = JSON.parse(e.data); renderBoard(); renderTunnels(); if (tab === "scan") renderScan(); });
  es.addEventListener("alerts", (e) => { alerts = JSON.parse(e.data) || []; renderBanners(); });
  es.addEventListener("switch", (e) => { sw = JSON.parse(e.data); renderBanners(); renderTunnels(); });
  es.addEventListener("speed", (e) => { speed = JSON.parse(e.data); renderTunnels(); if (tab === "board") renderBoard(); else if (tab === "scan") renderScan(); });
  es.onerror = () => { $("statusDot").className = "dot bad"; $("statusText").textContent = t("unreachable"); };
}

function renderAll() {
  if (!S) return;
  renderHeader();
  const live = new Set((S.monitors || []).map(m => m.host));
  for (const h of [...series.keys()]) if (!live.has(h)) series.delete(h);
  for (const h of [...colorOf.keys()]) if (!live.has(h)) colorOf.delete(h);
  for (const tn of (S.router.tunnels || [])) if (live.has(tn.host)) colorFor(tn.host);
  for (const h of [...live].sort()) colorFor(h);
  if (S.relay_count && relays.length !== S.relay_count) loadRelays();
  scaleMode = S.chart_scale || "auto";
  for (const b of $("scaleSeg").querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.v === scaleMode);
  renderBanners(); renderTunnels(); renderRouterBar(); renderMons(); renderFavs(); renderSettings(); renderBoard(); renderScan(); renderFooter();
}

// ---------- Tunnel & Router ----------
function statsFor(host, sec) {
  const x = series.get(host); if (!x) return null;
  const cut = Date.now() - sec * 1000;
  let n = 0, recv = 0, sum = 0, mn = Infinity, mx = -Infinity, js = 0, jn = 0, prev = null;
  for (const s of x.samples) {
    if (s.t < cut) continue; n++;
    if (s.ms == null) { prev = null; continue; }
    recv++; sum += s.ms; mn = Math.min(mn, s.ms); mx = Math.max(mx, s.ms);
    if (prev != null) { js += Math.abs(s.ms - prev); jn++; } prev = s.ms;
  }
  const last = x.samples.length ? x.samples[x.samples.length - 1].ms : null;
  if (!n) return null;
  return { n, loss: (n - recv) * 100 / n, avg: recv ? sum / recv : null, min: recv ? mn : null, max: recv ? mx : null, jitter: jn ? js / jn : null, last };
}

// bester Server eines Landes: zuerst Bestenliste, sonst letzte Rangliste
function bestFor(cc) {
  if (board && board.rows && board.on) {
    const r = board.rows.find(r => r.cc === cc && r.median > 0 && r.rounds >= 3);
    if (r) return { host: r.host, avg: r.median, src: t("srcBoard") };
  }
  if (scan && scan.results && !scan.running && scan.finished && Date.now() - new Date(scan.finished) < 3 * 3600e3) {
    const r = scan.results.find(r => r.cc === cc && r.recv > 0 && r.loss === 0);
    if (r) return { host: r.host, avg: r.avg, src: t("srcScan", { t: timeStr(scan.finished) }) };
  }

}

  const st = statsFor(host, 120); return st ? st.avg : null;
}

// ---------- Diagramm ----------
const cv = $("chart"), ctx = cv.getContext("2d");
let hoverX = null;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);

  let mn = Infinity, mx = -Infinity;
  for (const m of mons) { const x = series.get(m.host); if (!x) continue; for (const s of x.samples) if (s.t >= t0 && s.ms != null) { mn = Math.min(mn, s.ms); mx = Math.max(mx, s.ms); } }
  if (!isFinite(mn)) { mn = 1; mx = 50; }

  for (const v of ticks) { const y = Math.round(Y(v)) + .5; ctx.strokeStyle = grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); ctx.fillText(fmt(v, v < 10 && v % 1 ? 1 : 0), L - 8, y); }

(async () => {
  applyI18n();
  try { const saved = localStorage.getItem("rp-tab"); if (saved) document.querySelector(`.tab[data-tab="${saved}"]`)?.click(); } catch {}
  try { scan = await api("/api/scan"); if (!scan.results || !scan.results.length) scan = scan.running ? scan : null; } catch {}
  connectEvents();
  loop();
})();
</script>
</body>
</html>
